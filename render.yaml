services:
  - type: web
    name: gemini-web2api
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_COOKIE
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: GEMINI_DEFAULT_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_COOKIE_REFRESH_MIN
        value: "9"
